# Notification bubble, unread badge and history.
# Mochi seeds history silently from the snapshot it saved last time, then pops a
# bubble for anything that changed since. Format: scenarios/README.md.

fixtures:
  quiet_day:
    age_min: 60
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 30, claimed_ago_h: 20 }
    mine:
      - { id: m1, name: ember-results-sync, status: being_reviewed, review: open, claimed_ago_h: 5 }
      - { id: d1, name: ember-hidden-frames, status: draft, validation: pending, updated_ago_h: 3 }

  new_review_assigned:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 30, claimed_ago_h: 20 }
      - { id: r2, name: ember-turn-timer, review: open, due_in_h: 47, claimed_ago_h: 0.2 }
    mine:
      - { id: m1, name: ember-results-sync, status: being_reviewed, review: open, claimed_ago_h: 5 }
      - { id: d1, name: ember-hidden-frames, status: draft, validation: pending, updated_ago_h: 3 }

  my_task_accepted:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 30, claimed_ago_h: 20 }
    mine:
      - { id: m1, name: ember-results-sync, status: accepted, reviewed_ago_h: 0.1 }
      - { id: d1, name: ember-hidden-frames, status: draft, validation: pending, updated_ago_h: 3 }

  i_rejected_a_review:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: rejected, reviewed_ago_h: 0.1 }
    mine:
      - { id: m1, name: ember-results-sync, status: being_reviewed, review: open, claimed_ago_h: 5 }
      - { id: d1, name: ember-hidden-frames, status: draft, validation: pending, updated_ago_h: 3 }

  draft_failed_validation:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 30, claimed_ago_h: 20 }
    mine:
      - { id: m1, name: ember-results-sync, status: being_reviewed, review: open, claimed_ago_h: 5 }
      - id: d1
        name: ember-hidden-frames
        status: draft
        validation: failed
        failed_checks: [Metacode or Opus pass/fail balance]
        updated_ago_h: 0.1

  draft_passing:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 30, claimed_ago_h: 20 }
    mine:
      - { id: m1, name: ember-results-sync, status: being_reviewed, review: open, claimed_ago_h: 5 }
      - { id: d1, name: ember-hidden-frames, status: draft, validation: passing, updated_ago_h: 3 }

  draft_infra_error:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 30, claimed_ago_h: 20 }
    mine:
      - { id: m1, name: ember-results-sync, status: being_reviewed, review: open, claimed_ago_h: 5 }
      - id: d1
        name: ember-hidden-frames
        status: draft
        validation: failed
        errored_checks: [Metacode or Opus pass/fail balance]
        updated_ago_h: 0.1

scenarios:
  - id: notif-review-assigned
    title: A new review pops a bubble; clicking it opens the panel showing that review and clears the badge
    given: { saved: quiet_day, live: new_review_assigned }
    steps:
      - start
      - expect:
          bubble: Review Assigned
          see: [ember-turn-timer]
          badge: 1
          events:
            - { event: mochi_vpv, surface: bubble, component: bubble, notif_kind: review_assigned, task_id: r2, source: arrival }
      - click_bubble
      - expect:
          panel: open
          see: [Waiting for your review, ember-turn-timer]
          bubble: none
          badge: none
          events:
            - { event: mochi_click, surface: bubble, component: bubble, notif_kind: review_assigned, task_id: r2, source: arrival }

  - id: notif-open-in-codimango
    title: The bubble's "Open in Codimango" link opens the review page directly
    given: { saved: quiet_day, live: new_review_assigned }
    steps:
      - start
      - expect: { bubble: Review Assigned }
      - click: Open in Codimango ↗
      - expect:
          opened: [/reviews/r2]
          panel: closed
          bubble: none
          badge: none
          events:
            - { event: mochi_click, surface: bubble, component: open_link, notif_kind: review_assigned, task_id: r2 }

  - id: notif-task-name-opens-codimango
    title: Clicking the underlined task name in the bubble opens that task in Codimango, not the panel
    given: { saved: quiet_day, live: new_review_assigned }
    steps:
      - start
      - expect: { bubble: Review Assigned }
      - click_bubble_task
      - expect:
          opened: [/reviews/r2]
          panel: closed
          bubble: none
          badge: none
          events:
            - { event: mochi_click, surface: bubble, component: task_link, notif_kind: review_assigned, task_id: r2 }

  - id: notif-panel-bell
    title: The bell in the panel header opens notification settings, without showing a bubble
    given: { saved: quiet_day, live: i_rejected_a_review }
    steps:
      - start
      - expect: { bubble: none }
      - click_pet
      - press: Notification settings
      - expect:
          bubble: none
          panel: open
          see: [Notify me about, Validation failed, Task Rejected]
          events:
            - { event: mochi_click, surface: glance_panel, component: notify_menu }

  - id: notif-own-verdict-quiet
    title: Your own verdict on a review is saved to history but does not pop
    given: { saved: quiet_day, live: i_rejected_a_review }
    steps:
      - start
      - expect: { bubble: none, badge: none }
      - click_bell
      - expect: { bubble: Task Rejected, see: [A task assigned to you was rejected] }

  - id: notif-task-accepted
    title: Your task being accepted pops in the owner's voice
    given: { saved: quiet_day, live: my_task_accepted }
    steps:
      - start
      - expect:
          bubble: Task Accepted
          see: [ember-results-sync, Your task was accepted into the benchmark.]

  - id: notif-validation-failed
    title: A failed draft names the failing check in plain words
    given: { saved: quiet_day, live: draft_failed_validation }
    steps:
      - start
      - expect: { bubble: "Validation failed (Solvability & difficulty)." }
      - click_bubble
      - expect: { panel: open, bubble: none }

  - id: notif-validation-infra-error-replaces-passed
    title: A passed draft that later fails on an infra error says so, and the bell no longer replays the old "passed"
    given: { saved: draft_passing, live: draft_infra_error }
    steps:
      - start
      - expect:
          bubble: "Solvability & difficulty couldn't run (an infrastructure error, not your task). Revalidate to re-run it."
      - close_bubble
      - click_bell
      - expect: { bubble: Validation failed }
      - bubble_older
      - expect: { not_see: [All validation checks passed.] }

  - id: notif-kind-switched-off
    title: A notification kind switched off in the menu doesn't pop, but the bell still shows it
    given: { saved: quiet_day, live: draft_failed_validation, notify: { validation_failed: false } }
    steps:
      - start
      - expect: { bubble: none, badge: none }
      - click_bell
      - expect: { bubble: "Validation failed (Solvability & difficulty)." }

  - id: notif-switch-in-menu
    title: The bell menu lists notification kinds, all on by default, and logs a switch
    given: { live: draft_failed_validation }
    steps:
      - start
      - click_pet
      - open_notify_menu
      - expect: { see: [Notify me about, Validation failed, Review Assigned, Codimango SEV, Agent review] }
      - toggle_section: Validation failed
      - expect:
          events:
            - { event: mochi_click, surface: glance_panel, component: notify_filter, notif_kind: validation_failed, enabled: false }

  - id: notif-first-launch-silent
    title: First launch (nothing saved) builds history without popping anything
    given: { live: my_task_accepted }
    steps:
      - start
      - expect: { bubble: none, badge: none }
      - click_bell
      - expect: { bubble: Task Accepted }

  - id: notif-no-repeat
    title: The same data fetched again does not pop a second time
    given: { saved: quiet_day, live: new_review_assigned }
    steps:
      - start
      - expect: { bubble: Review Assigned }
      - close_bubble
      - expect: { bubble: none }
      - click_pet
      - refresh_now
      - wait: 100
      - expect: { bubble: none, panel: open }

  - id: notif-history-stepping
    title: The bell shows the latest notice; › steps older and ‹ steps back
    given: { saved: quiet_day, live: [new_review_assigned, my_task_accepted] }
    steps:
      - start
      - expect: { bubble: Review Assigned }
      - close_bubble
      - click_pet
      - refresh_now
      - expect: { bubble: Task Accepted }
      - close_bubble
      - click_bell
      - expect: { bubble: Task Accepted, badge: none }
      - bubble_older
      - expect: { bubble: Review Assigned }
      - bubble_newer
      - expect: { bubble: Task Accepted }
