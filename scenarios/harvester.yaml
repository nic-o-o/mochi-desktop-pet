# The agent line under drafts and revisions: what Harvester (on this Mac) is
# doing with each task, with its one-line reason, and Stop / Fix validation /
# Address revisions.
# Format: scenarios/README.md. `harvester:` stands in for the Harvester board.

fixtures:
  week:
    reviewing:
      - { id: r1, name: ember-lobby-seat, review: open, due_in_h: 60, claimed_ago_h: 10 }
    mine:
      - id: v1
        name: ember-results-sync
        status: needs_revision
        validation: failed
        failed_checks: [Oracle validation]
        oracle: 1/3
        failing_since_d: 2
      - { id: d3, name: ember-draft-failing, status: draft, validation: failed, failed_checks: [AI assessment], updated_ago_h: 2 }

scenarios:
  - id: harvester-status-lines
    title: Drafts show Harvester's status and reason on a second line, under the validation line
    given:
      live: week
      sections: { revisions: true, reviews: true, drafts: true }
      harvester:
        ember-draft-failing: { kind: working, reason: "Repairing the AI assessment findings, round 2" }
        ember-results-sync: { kind: stuck, reason: "No output for over 10 minutes", intent: revision }
    steps:
      - start
      - click_pet
      - expect:
          see:
            - "Validation failed · Oracle 1/3"
            - "Harvester stuck addressing revisions · No output for over 10 minutes"
            - "Harvester fixing validation · Repairing the AI assessment findings, round 2"

  - id: harvester-stop-stuck
    title: A stuck Harvester run can be stopped from the row, after a confirmation
    given:
      live: week
      harvester:
        ember-results-sync: { kind: stuck, reason: "No output for over 10 minutes" }
    steps:
      - start
      - click_pet
      - click: Stop
      - expect: { see: [Stop Harvester, Stops the stuck run so you can restart it.], harvester_calls: [] }
      - click: Stop
      - expect:
          # Harvester now reports the run stopped, so the row offers the next step and drops its own note.
          see: [Harvester stopped, Address revisions]
          not_see: [Stopped. Harvester leaves the task alone until you start it again.]
          harvester_calls: [stop run-ember-results-sync]
          events:
            - { event: mochi_click, surface: glance_panel, component: harvester_stop, task_id: v1, status: stuck }

  - id: harvester-restart-stopped
    title: A stopped run on a Needs revision row offers Address revisions, which asks Harvester for its revision workflow after saying it will push
    given:
      live: week
      harvester:
        # The last run was a plain revive; a revision row still starts a revision run.
        ember-results-sync: { kind: stopped, reason: "Exhausted the repair budget", intent: revive }
    steps:
      - start
      - click_pet
      - expect: { see: ["Harvester stopped · Exhausted the repair budget"], not_see: [Fix validation] }
      - click: Address revisions
      - expect: { see: [Harvester will address the requested revisions on, It pushes its repairs to the task and posts a comment], harvester_calls: [] }
      - click: Address revisions
      - expect:
          # The status line says it now; the confirmation note would only repeat it.
          see: ["Harvester addressing revisions · Queued"]
          not_see: ["Queued: Harvester will address the revisions."]
          harvester_calls: [restart ember-results-sync revision]
          events:
            - { event: mochi_click, surface: glance_panel, component: harvester_restart, task_id: v1, status: stopped }

  - id: harvester-restart-draft
    title: A stopped run on a draft offers Fix validation, Harvester's revive workflow
    given:
      live: week
      sections: { revisions: false, reviews: false, drafts: true }
      harvester:
        ember-draft-failing: { kind: stopped, reason: "Harvester stopped before finishing.", intent: revision }
    steps:
      - start
      - click_pet
      - expect: { not_see: [Address revisions] }
      - click: Fix validation
      - expect: { see: [Harvester will fix validation on] }
      - click: Fix validation
      - expect: { see: ["Harvester fixing validation · Queued"], not_see: ["Queued: Harvester will fix validation."], harvester_calls: [restart ember-draft-failing revive] }

  - id: harvester-absent
    title: Without Harvester on this Mac, rows have no agent line
    given: { live: week }
    steps:
      - start
      - click_pet
      - expect: { see: ["Validation failed · Oracle 1/3"], not_see: [Harvester] }

  - id: harvester-plain-reasons
    title: Harvester's common internal reasons read in plain words; the original stays in the tooltip
    given:
      live: week
      sections: { revisions: true, reviews: false, drafts: true }
      harvester:
        ember-draft-failing: { kind: working, reason: "durable owner is repairing or running local checks" }
        ember-results-sync: { kind: working, reason: "published 609cf09e87ed is still being validated by Nest", intent: revision }
    steps:
      - start
      - click_pet
      - expect:
          see:
            - "Harvester fixing validation · Working on the fix and running tests"
            - "Harvester addressing revisions · Pushed a fix; waiting for Codimango to validate it"
          not_see: [durable owner, validated by Nest]

