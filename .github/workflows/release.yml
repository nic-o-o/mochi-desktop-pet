# Release: pushing a `v*` tag builds the Mac DMG and publishes the GitHub
# Release with it attached. Testers download from the `releases/latest`
# link — no terminal needed. (See README "Release cadence & version cuts".)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    # Apple Silicon build. Intel Macs need a universal build or second job —
    # add when a tester asks (see README install notes).
    # NOTE: `macos-14` is not offered on this host — keep `macos-latest`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Developer-ID cert for proper signing. Skipped (ad-hoc fallback)
      # until the MAC_CERT_* secrets exist — see README "Proper signing".
      - name: Install signing certificate
        if: ${{ secrets.MAC_CERT_P12 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      # Builds out/Mochi.app + out/Mochi.dmg (no --install: nothing to
      # install on a runner). Signed + notarized when the APPLE_* secrets
      # exist (see README "Proper signing"); otherwise ad-hoc (first launch
      # needs System Settings → Privacy & Security → Open Anyway).
      - run: npm run package
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: softprops/action-gh-release@v2
        with:
          files: out/Mochi.dmg
          generate_release_notes: true
